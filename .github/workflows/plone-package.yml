name: collective.bpmproxy

on:
  push:
    branches: [master, main]
  # Any base branch, not only master/main: a PR stacked on another PR's
  # branch must get CI too.
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    # The package lives under backend/ since the monorepo restructure.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff check
        run: uvx ruff check src ../scripts
      - name: Ruff format
        run: uvx ruff format --check src ../scripts

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra test --locked
      - name: Run tests
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build package
        run: uv build
      - name: Check package
        run: uvx twine check dist/*

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-classic/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend-classic
      - name: Type-check sources
        run: npm run typecheck
        working-directory: frontend-classic
      - name: Build bundles
        run: npm run build
        working-directory: frontend-classic
      # The built bundles are committed (they ship in the sdist), so a stale
      # commit of them has to fail here rather than in someone's browser.
      - name: Built bundles are up to date
        run: git diff --exit-code -- backend/src/collective/bpmproxy/browser/static

  operaton-fixture:
    name: Operaton fixture (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixture/operaton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Uses the tracked Maven wrapper, so this also guards against the
      # wrapper's .mvn/wrapper/maven-wrapper.properties going missing again.
      - name: Run tests
        run: ./mvnw -B test

  screencast-engine:
    name: Screencast engine (scripts/screencast/), ${{ matrix.robotframework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release (what devenv's pinned nixpkgs ships,
        # so what users actually run) and the newest. An API missing from
        # the oldest -- robot.api.console needs 7.5, say -- fails here, not
        # only on a devenv shell. The minimum is stated in
        # scripts/screencast/README.md.
        robotframework: ["robotframework==7.4.2", "robotframework"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the engine's own tests, not the stories in scripts/screencasts/:
      # those need a live Plone/Operaton/Keycloak stack devenv provides and
      # CI does not (see docs/AGENTS.md). The engine's tests need none of
      # that -- screencast.library is tested against a fake Playwright
      # (tests/fakes.py), and the composer/verifier against real ffmpeg on
      # tiny synthetic clips -- so they run here on every push/PR, unlike
      # the old e2e_*.py scripts this replaced, which had no CI coverage at
      # all.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: pip install pytest jsonschema "${{ matrix.robotframework }}"
      - name: Run tests
        run: |
          PYTHONPATH=scripts python -m screencast --version
          PYTHONPATH=scripts python -m pytest scripts/screencast/tests/
