site_name: robotframework-screencast
site_description: Record, compose and verify multi-actor browser screencasts from Robot Framework stories.
site_url: https://datakurre.github.io/robotframework-screencast/
repo_url: https://github.com/datakurre/robotframework-screencast
edit_uri: edit/main/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow

# The pages take their content from the README, the agent skill and its
# reference (see docs/*.md), so there is one text to keep true, not three.
plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Writing stories: stories.md
  - The timeline: timeline.md
  - Sharing data between tasks: state.md
  - Debugging: debugging.md
  - Take verification: verification.md
  - Extending the engine: extending.md
  - Reference: reference.md
  - Timeline schema: schema.md
