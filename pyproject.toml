[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robotframework-screencast"
dynamic = ["version"]
description = "Record, compose and verify multi-actor browser screencasts from Robot Framework stories."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
keywords = ["robotframework", "playwright", "screencast", "video", "documentation"]
classifiers = [
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Testing",
]
# Robot Framework 7.4 is the oldest supported release (see README.md).
dependencies = [
    "robotframework>=7.4",
    "playwright>=1.40",
    "jsonschema>=4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
screencast = "screencast.__main__:main"

[project.urls]
Source = "https://github.com/datakurre/robotframework-screencast"
Example = "https://github.com/datakurre/collective.bpmproxy/tree/master/scripts/screencasts"

[tool.hatch.version]
path = "src/screencast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/screencast"]
# The tests ship in the sdist, not in the installed package.
exclude = ["src/screencast/tests"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/.agents", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["src/screencast/tests"]

# The style the code was written in, inside collective.bpmproxy.
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
from-first = true
lines-after-imports = 2
no-sections = true
order-by-type = false
